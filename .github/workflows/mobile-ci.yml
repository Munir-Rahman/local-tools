name: Mobile CI
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'packages/catalog/**'
      - 'scripts/mobile-doctor.cjs'
      - '.github/workflows/mobile-ci.yml'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'packages/catalog/**'
      - 'scripts/mobile-doctor.cjs'
      - '.github/workflows/mobile-ci.yml'
jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Expo / React Native dependencies
        run: npm install --workspace @local-tools/mobile --workspace @local-tools/core --include-workspace-root --no-audit --no-fund
      - name: Run npm dependency integrity doctor
        run: npm run mobile:doctor
      - name: Validate mobile catalog metadata
        run: npm run test:catalog --workspace @local-tools/mobile
      - name: Verify 5000 records inside standalone mobile project
        run: npm run test:full-catalog --workspace @local-tools/mobile
      - name: Test additional offline text converters
        run: node --experimental-strip-types --test apps/mobile/tests/textEngines.test.mjs
      - name: Verify real offline unit conversions
        run: npm run test:unit-conversions --workspace @local-tools/mobile
      - name: Test Android picker, MIME mapping and permission regressions
        run: node --experimental-strip-types --test apps/mobile/tests/filePicker.test.mjs
      - name: Test Gregorian, Shamsi and civil Hijri conversions
        run: node --experimental-strip-types --test apps/mobile/tests/calendarEngine.test.mjs
      - name: Validate offline financial formulas
        run: node --experimental-strip-types --test apps/mobile/tests/financeEngine.test.mjs
      - name: Typecheck native mobile source
        run: npm run typecheck --workspace @local-tools/mobile
      - name: Validate Expo configuration
        run: npx --workspace @local-tools/mobile expo config --json > /tmp/localtools-expo-config.json
      - name: Bundle offline Android JavaScript
        run: cd apps/mobile && npx expo export --platform android --output-dir /tmp/localtools-mobile-export
