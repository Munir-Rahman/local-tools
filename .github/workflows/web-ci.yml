name: Web CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --workspace @local-tools/web --workspace @local-tools/core --include-workspace-root --no-audit --no-fund
      - name: Test desktop local server
        run: npm run desktop:check
      - name: Test offline utility engines
        run: npm test
      - name: Test local utility engine
        run: node --experimental-strip-types --test apps/web/tests/extraEngine.test.mjs
      - name: Type-check
        run: npm run typecheck
      - name: Build offline web application
        run: npm run build
      - name: Verify offline service worker output
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/sw.js
          test -f apps/web/dist/manifest.webmanifest
          test -f apps/web/dist/ffmpeg/ffmpeg-core.js
          test -f apps/web/dist/ffmpeg/ffmpeg-core.wasm
      - name: Install Chromium for browser persistence tests
        run: npx playwright install --with-deps chromium
      - name: Test SQLite, favorites and local FFmpeg in Chromium
        run: npx playwright test
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: localtools-web
          path: apps/web/dist
          if-no-files-found: error
