name: Build ToolNest Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/mobile/**' # Rebuild both installers when a mobile repair release is published
      - 'apps/web/**'
      - 'packages/core/**'
      - '.github/workflows/desktop-installer.yml'

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web and desktop dependencies
        run: npm.cmd install --workspace @local-tools/web --workspace @local-tools/core --workspace @local-tools/desktop --include-workspace-root --no-audit --no-fund

      - name: Verify desktop's local server
        run: npm.cmd run desktop:check

      - name: Build ToolNest web assets
        run: npm.cmd run build

      - name: Package Windows NSIS installer
        run: npm.cmd run dist:win --workspace @local-tools/desktop

      - name: Upload installable EXE
        uses: actions/upload-artifact@v4
        with:
          name: ToolNest-Windows-Installer
          path: releases/**/*.exe
          if-no-files-found: error
          retention-days: 14
